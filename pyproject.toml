[project]
name = "veyra-worker"
version = "0.3.0"
description = "Worker de GPU de Veyra: ejecuta entrenamientos, predicciones y sesiones en vivo por encargo de la API"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "numpy", "opencv-python-headless"]

[project.scripts]
veyra-worker = "veyra_worker.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
veyra_worker = ["scripts/*.py"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
